[metadata]
name = bitcoin-widget
version = 0.1.0
description = Layered Bitcoin price widget
author = Your Name
author_email = your.email@example.com
license = MIT

[options]
packages = find:
install_requires =
    requests>=2.32.0
python_requires = >=3.9

[options.extras_require]
dev =
    pytest>=7.4

[options.packages.find]
where = src

[tool:pytest]
testpaths = tests

[coverage:run]
branch = True
source = src/bitcoin_widget

[coverage:report]
show_missing = True
skip_covered = True
