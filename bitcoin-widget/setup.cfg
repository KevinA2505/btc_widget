[metadata]
name = bitcoin-widget
version = 0.1.0
description = A Bitcoin widget application for displaying real-time Bitcoin data.
author = Your Name
author_email = your.email@example.com
license = MIT
url = https://github.com/yourusername/bitcoin-widget

[options]
packages = find:
install_requires =
    requests
    tkinter

[options.packages.find]
where = src

[tool:pytest]
testpaths = tests

[coverage:run]
branch = True
source = src/bitcoin_widget

[coverage:report]
show_missing = True
skip_covered = True